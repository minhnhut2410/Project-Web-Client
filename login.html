<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/global.css">
    <title>Document</title>
</head>

<body>
    <header>
        <h2>Sport Store</h2>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <button class="icon-btn btn-change-mode" aria-label="Dark Mode">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-moon-icon lucide-moon">
                    <path
                        d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
                </svg>
            </button>
            <button class="icon-btn" aria-label="Search">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-search-icon lucide-search">
                    <path d="m21 21-4.34-4.34" />
                    <circle cx="11" cy="11" r="8" />
                </svg>
            </button>
            <a href="cart.html">
                <button class="icon-btn position-relative me-4" aria-label="Cart">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-shopping-cart-icon lucide-shopping-cart">
                        <circle cx="8" cy="21" r="1" />
                        <circle cx="19" cy="21" r="1" />
                        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                    </svg>
                    <badge id="cart-badge" class="cart-badge position-absolute">0</badge>
                </button>
            </a>
            <a href="login.html" id="btn-login" class="btn-login">Login</a>
        </div>
    </header>
    <div class="login-wrapper d-flex justify-content-center align-items-center vh-100">
        <div class="bg-white p-5 rounded-4 shadow-sm border" style="width: 100%; max-width: 500px;">
            <div class="login-header d-flex flex-column align-items-center gap-3">
                <div class="bg-black text-white rounded-circle p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-log-in-icon lucide-log-in">
                        <path d="m10 17 5-5-5-5" />
                        <path d="M15 12H3" />
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    </svg>
                </div>
                <div class="text-center">
                    <h2 class="fw-bold fs-2">Welcome Back</h2>
                    <p class="text-muted">Login to your account</p>
                </div>
            </div>
            <form id="login-form" class="login-body w-100">
                <div class="mb-3 w-100">
                    <label class="fw-bold small mb-1">Email</label>
                    <input id="email-input" class="form-control p-2" type="email" placeholder="Enter your email">
                    <small id="email-error" class="text-danger"></small>
                </div>

                <div class="mb-4 w-100">
                    <label class="fw-bold small">Password</label>
                    <input id="password-input" class="form-control p-2" type="password"
                        placeholder="Enter your password">
                    <small id="password-error" class="text-danger"></small>
                </div>

                <div class="w-100">
                    <button class="btn-login-main bg-black text-white btn-dark w-100 fw-bold rounded-3 py-2"
                        type="submit">Login</button>
                </div>
            </form>

            <div class="login-footer mt-4">
                <div class="text-center">
                    <p> Don't have an account? <a href="register.html" class="text-primary">Register Here</a></p>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-content">
            <div class="footer-column">
                <h3>About us</h3>
                <p>dfasfdsaf</p>
            </div>
            <div class="footer-column">
                <h3>Customer Service</h3>
                <ul>
                    <li><a href="">Contact Us</a></li>
                    <li><a href="">Shipping Info</a></li>
                    <li><a href="">Returns</a></li>
                </ul>
            </div>
            <div class="footer-column">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="">FAQ</a></li>
                    <li><a href="">Size Guide</a></li>
                    <li><a href="">Terms

                </ul>
            </div>
        </div>
    </footer>
    <script src="js/login.js"></script>
        <script src="js/afterLogin.js"></script>

    <script src="js/changeMode.js"></script>


</body>

</html>
